<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; margin: 0; padding: 12px; width: 260px; background: #1e1f24; color: #e6e6ea; }
  h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  p { margin: 0 0 10px; color: #a9abb3; line-height: 1.4; }
  button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #4f7cff; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin-top: 10px; min-height: 1.4em; }
  .ok { color: #6fd48a; } .err { color: #ff8a80; }
</style>
</head>
<body>
  <h1>Downloader sign-in</h1>
  <p>rule34video allows one session per account. This shares the session Chrome already has with the Downloader app (open on this PC), so neither gets signed out.</p>
  <button id="send">Send rule34video sign-in</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
